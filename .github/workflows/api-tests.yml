name: API Automation Tests (Serenity & Karate)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Tests
        run: mvn clean verify

      - name: Publish Serenity Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-reports
          path: serenity-rest-module/target/site/serenity/
          retention-days: 7

      - name: Publish Karate Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karate-reports
          path: karate-module/target/karate-reports/
          retention-days: 7
